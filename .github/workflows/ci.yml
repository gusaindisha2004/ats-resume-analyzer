name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # torch is the bulk of the install and the CPU build is a fraction of
      # the default wheel's size. Nothing here needs CUDA.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      # The model is a versioned wheel, so this cache key never goes stale.
      - name: Cache spaCy model
        id: spacy-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/spacy-model
          key: spacy-en_core_web_md-3.8.0

      - name: Install spaCy model
        run: python -m spacy download en_core_web_md

      # test_pipeline and test_api load all-MiniLM-L6-v2 for real.
      - name: Cache sentence-transformer
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Run tests
        run: pytest backend/tests -q
        env:
          # Keep the suite off production limits; test_rate_limit re-enables.
          RATE_LIMIT_ENABLED: "false"

  frontend:
    name: Frontend (types, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Catches anything that only fails in a production build — bad imports,
      # server/client boundary mistakes, prerender errors.
      - name: Build
        run: npm run build
        env:
          # The build only needs these to be present and well-formed.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:8000
